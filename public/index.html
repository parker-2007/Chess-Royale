<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess Royale</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0d0d1a; font-family:'Segoe UI',sans-serif; touch-action:none; }
  body { display:flex; justify-content:center; align-items:center; }
  #game-container { position:relative; }
  #lobby {
    position:fixed; inset:0; background:#0d0d1a; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; z-index:100; padding:20px;
  }
  #lobby h1 { font-size:clamp(24px,6vw,36px); color:#c084fc; font-weight:700; letter-spacing:2px; }
  #lobby p  { font-size:13px; color:#5050a0; }
  #lobby input {
    background:#12122a; border:1px solid #3a3a6a; border-radius:8px;
    color:#e0e0ff; font-size:20px; padding:10px 16px; text-align:center;
    width:min(200px,80vw); letter-spacing:4px; text-transform:uppercase; outline:none;
  }
  #lobby input:focus { border-color:#8b5cf6; }
  .lobby-btn {
    background:#8b5cf6; color:white; border:none; border-radius:8px;
    padding:14px 28px; font-size:15px; font-weight:600; cursor:pointer;
    width:min(200px,80vw); transition:background 0.15s;
  }
  .lobby-btn:active { background:#6d28d9; }
  .lobby-btn.outline { background:transparent; border:1px solid #3a3a6a; color:#8080b0; }
  .lobby-btn.outline:active { border-color:#8b5cf6; color:#c084fc; }
  #lobby-status { font-size:12px; color:#f87171; min-height:18px; text-align:center; }
  #waiting { font-size:13px; color:#8080b0; display:none; text-align:center; }
  #ui-overlay {
    position:absolute; bottom:0; left:0; right:0;
    display:flex; align-items:flex-end; justify-content:center;
    gap:6px; padding:6px; pointer-events:none;
  }
  .card-slot {
    background:#12122a; border:1.5px solid #2a2a5a; border-radius:10px;
    padding:6px 2px 5px; display:flex; flex-direction:column;
    align-items:center; gap:3px; cursor:pointer; pointer-events:all;
    transition:border-color 0.15s, transform 0.1s; user-select:none;
    width:var(--card-w);
  }
  .card-slot:active { transform:translateY(-2px); border-color:#60a5fa; }
  .card-slot.selected { border-color:#60a5fa; border-width:2px; transform:translateY(-4px); }
  .card-slot.disabled { opacity:0.4; cursor:not-allowed; transform:none; }
  .card-icon { font-size:var(--card-icon); line-height:1; }
  .card-name { font-size:8px; color:#8080b0; text-transform:uppercase; letter-spacing:0.5px; }
  .card-cost { background:#7c3aed; border-radius:4px; padding:1px 6px; font-size:10px; color:#e0d0ff; font-weight:600; }
  .card-cost.red { background:#dc2626; }
  #next-card {
    background:#0d0d1a; border:0.5px dashed #2a2a5a; border-radius:8px;
    width:calc(var(--card-w) * 0.75); padding:5px 2px; display:flex; flex-direction:column;
    align-items:center; gap:2px; opacity:0.6;
  }
  #elixir-bar-container {
    position:absolute; left:4px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  #elixir-track {
    width:12px; height:var(--elixir-h); background:#1e1e3a; border-radius:6px;
    overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end;
  }
  #elixir-fill { width:100%; height:0%; background:#8b5cf6; border-radius:6px; transition:height 0.1s linear; }
  #elixir-val { font-size:11px; color:#c084fc; font-weight:600; }
  #player-labels {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; padding:4px 8px; pointer-events:none;
  }
  .plabel { display:flex; align-items:center; gap:5px; font-size:10px; font-weight:500; }
  .pdot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  #hotkeys { position:absolute; bottom:var(--card-bar-h); left:50%; transform:translateX(-50%); font-size:8px; color:#2a2a5a; pointer-events:none; white-space:nowrap; }
  #gameover {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(10,10,30,0.98); border:1px solid #8b5cf6; border-radius:14px;
    padding:20px 32px; text-align:center; display:none; z-index:20; width:80%;
  }
  #gameover h1 { font-size:22px; margin-bottom:6px; }
  #gameover button {
    margin-top:14px; background:#8b5cf6; color:white; border:none;
    border-radius:8px; padding:10px 24px; font-size:14px; font-weight:600; cursor:pointer;
  }
  #disconnected {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(10,10,30,0.98); border:1px solid #dc2626; border-radius:14px;
    padding:20px 32px; text-align:center; display:none; z-index:30; width:80%;
  }
  #disconnected h2 { color:#f87171; margin-bottom:8px; font-size:18px; }
  #disconnected p { color:#8080b0; font-size:13px; }
</style>
</head>
<body>

<div id="lobby">
  <h1>Chess Royale</h1>
  <p>Chess meets Clash Royale</p>
  <input id="room-input" maxlength="6" placeholder="ROOM CODE" autocomplete="off" />
  <button class="lobby-btn" onclick="createRoom()">Create Room</button>
  <button class="lobby-btn outline" onclick="joinRoom()">Join Room</button>
  <div id="lobby-status"></div>
  <div id="waiting">⏳ Waiting for opponent...</div>
</div>

<div id="game-container" style="display:none;">
  <div id="player-labels">
    <div class="plabel" style="color:#f87171;"><div class="pdot" style="background:#f87171;"></div><span id="p2label">Opponent</span></div>
    <div class="plabel" style="color:#60a5fa;"><span id="p1label">You</span><div class="pdot" style="background:#60a5fa;"></div></div>
  </div>
  <div id="elixir-bar-container">
    <span style="font-size:9px;color:#6060a0;">21</span>
    <div id="elixir-track"><div id="elixir-fill"></div></div>
    <span id="elixir-val">0</span>
    <span style="font-size:7px;color:#4040a0;">elixir</span>
  </div>
  <div id="ui-overlay">
    <div class="card-slot" id="card0" onclick="selectCard(0)">
      <div class="card-icon" id="icon0">♟</div>
      <div class="card-name" id="cname0">Pawn</div>
      <div class="card-cost" id="ccost0">2</div>
    </div>
    <div class="card-slot" id="card1" onclick="selectCard(1)">
      <div class="card-icon" id="icon1">♞</div>
      <div class="card-name" id="cname1">Knight</div>
      <div class="card-cost" id="ccost1">5</div>
    </div>
    <div class="card-slot" id="card2" onclick="selectCard(2)">
      <div class="card-icon" id="icon2">♜</div>
      <div class="card-name" id="cname2">Rook</div>
      <div class="card-cost" id="ccost2">7</div>
    </div>
    <div id="next-card">
      <div style="font-size:7px;color:#4040a0;text-transform:uppercase;">next</div>
      <div class="card-icon" id="next-icon" style="font-size:16px;">♝</div>
      <div style="font-size:7px;color:#4040a0;" id="next-name">Bishop</div>
    </div>
  </div>
  <div id="hotkeys">tap piece → tap destination · tap card → tap home row</div>
  <div id="gameover">
    <h1 id="go-title">You Win!</h1>
    <p style="color:#8080b0;font-size:13px;">The king has been captured.</p>
    <button onclick="requestRematch()" id="rematch-btn" style="margin-top:14px;background:#8b5cf6;color:white;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer;width:100%;">Rematch</button>
    <p id="rematch-status" style="color:#8080b0;font-size:11px;margin-top:8px;min-height:16px;"></p>
  </div>
  <div id="disconnected">
    <h2>Opponent Left</h2>
    <p>The game has ended.</p>
  </div>
</div>

<script>
// ── Responsive sizing ──────────────────────────────────────────────────────
const CARD_BAR_H = Math.min(90, window.innerHeight * 0.16);
const LABEL_H = 24;
const BOARD_SIZE = Math.min(window.innerWidth - 24, window.innerHeight - CARD_BAR_H - LABEL_H - 8);
const CELL = Math.floor(BOARD_SIZE / 8);
const BOARD_PX = CELL * 8;
const CANVAS_W = BOARD_PX + 22;
const CANVAS_H = BOARD_PX + LABEL_H + CARD_BAR_H;
const CARD_W = Math.min(72, (BOARD_PX - 60) / 3.8);
const CARD_ICON = Math.min(28, CARD_W * 0.42);
const ELIXIR_H = BOARD_PX - 10;

document.documentElement.style.setProperty('--card-w', CARD_W+'px');
document.documentElement.style.setProperty('--card-icon', CARD_ICON+'px');
document.documentElement.style.setProperty('--elixir-h', ELIXIR_H+'px');
document.documentElement.style.setProperty('--card-bar-h', CARD_BAR_H+'px');

// ── Socket ─────────────────────────────────────────────────────────────────
const socket = io();
let myPlayerIdx = -1;

const PIECE_ICONS = {king:'♔',queen:'♛',rook:'♜',bishop:'♝',knight:'♞',pawn:'♟'};
const PIECE_NAMES = {king:'King',queen:'Queen',rook:'Rook',bishop:'Bishop',knight:'Knight',pawn:'Pawn'};
const PIECE_DEPLOY = {king:0,queen:10,rook:7,bishop:5,knight:5,pawn:2};

function moveCostClient(type, fr, fc, tr, tc) {
  const d = Math.max(Math.abs(tr-fr), Math.abs(tc-fc));
  return type==='knight' ? 5 : d*{king:10,queen:3,rook:2,bishop:2,pawn:1}[type];
}

function setStatus(msg, err=false) {
  const el=document.getElementById('lobby-status');
  el.textContent=msg; el.style.color=err?'#f87171':'#8080b0';
}
function createRoom() {
  const code=document.getElementById('room-input').value.trim().toUpperCase();
  if(!code||code.length<2){setStatus('Enter a room code first',true);return;}
  socket.emit('createRoom',code);
}
function joinRoom() {
  const code=document.getElementById('room-input').value.trim().toUpperCase();
  if(!code||code.length<2){setStatus('Enter the room code',true);return;}
  socket.emit('joinRoom',code);
}

socket.on('joined',({playerIdx})=>{
  myPlayerIdx=playerIdx;
  if(playerIdx===0) document.getElementById('waiting').style.display='block';
});
socket.on('error',(msg)=>setStatus(msg,true));
socket.on('gameStart',()=>{
  document.getElementById('lobby').style.display='none';
  document.getElementById('game-container').style.display='block';
  if(myPlayerIdx===1){
    document.getElementById('p1label').textContent='You (Red)';
    document.getElementById('p2label').textContent='Opponent (Blue)';
  }
  initPhaserGame();
});
socket.on('rematchVote', ({votes}) => {
  document.getElementById('rematch-status').textContent = votes === 1 ? 'Waiting for opponent...' : 'Both ready!';
  document.getElementById('rematch-btn').disabled = true;
  document.getElementById('rematch-btn').style.opacity = '0.5';
});

socket.on('rematchStart', () => {
  document.getElementById('gameover').style.display = 'none';
  document.getElementById('rematch-btn').disabled = false;
  document.getElementById('rematch-btn').style.opacity = '1';
  document.getElementById('rematch-status').textContent = '';
  selected = null; selectedCard = -1;
});

function requestRematch() {
  socket.emit('rematch');
  document.getElementById('rematch-status').textContent = 'Waiting for opponent...';
  document.getElementById('rematch-btn').disabled = true;
  document.getElementById('rematch-btn').style.opacity = '0.5';
}

socket.on('playerLeft',()=>{ document.getElementById('disconnected').style.display='block'; });

// ── State ──────────────────────────────────────────────────────────────────
let gameState=null, selected=null, selectedCard=-1;

socket.on('state',(state)=>{
  gameState=state;
  if(state.gameOver){
    const won=state.winner===myPlayerIdx+1;
    document.getElementById('go-title').textContent=won?'👑 You Win!':'💀 You Lose';
    document.getElementById('go-title').style.color=won?'#60a5fa':'#f87171';
    document.getElementById('gameover').style.display='block';
  }
  renderAll();
});

// ── Phaser ─────────────────────────────────────────────────────────────────
let scene, cellG=[], pieceT=[], costT=[], cdOv=[], cdTxt=[];

function initPhaserGame() {
  new Phaser.Game({
    type:Phaser.AUTO, width:CANVAS_W, height:CANVAS_H,
    backgroundColor:'#0d0d1a', parent:'game-container',
    scene:{create:createScene}
  });
}

function createScene() {
  scene=this;
  const OX=22, OY=LABEL_H;
  for(let r=0;r<8;r++){
    cellG[r]=[]; pieceT[r]=[]; costT[r]=[]; cdOv[r]=[]; cdTxt[r]=[];
    for(let c=0;c<8;c++){
      const x=OX+c*CELL, y=OY+r*CELL;
      const g=scene.add.rectangle(x+CELL/2,y+CELL/2,CELL-1,CELL-1,(r+c)%2===0?0x2d2d50:0x1e1e3a);
      g.setInteractive();
      g.on('pointerdown',()=>onCellClick(r,c));
      g.on('pointerover',()=>{ if(!g.hl) g.setFillStyle((r+c)%2===0?0x3a3a60:0x2a2a4a); });
      g.on('pointerout', ()=>{ if(!g.hl) g.setFillStyle((r+c)%2===0?0x2d2d50:0x1e1e3a); });
      g.hl=false; cellG[r][c]=g;

      pieceT[r][c]=scene.add.text(x+CELL/2,y+CELL/2,'',{
        fontSize:Math.floor(CELL*0.5)+'px',color:'#ffffff'
      }).setOrigin(0.5,0.5).setDepth(2);

      costT[r][c]=scene.add.text(x+CELL-3,y+3,'',{
        fontSize:Math.max(9,Math.floor(CELL*0.18))+'px',
        fontStyle:'bold',stroke:'#000',strokeThickness:3
      }).setOrigin(1,0).setDepth(10);

      cdOv[r][c]=scene.add.rectangle(x+CELL/2,y+CELL/2,CELL-1,CELL-1,0x000000,0.6)
        .setDepth(5).setVisible(false);

      cdTxt[r][c]=scene.add.text(x+CELL/2,y+CELL/2,'',{
        fontSize:Math.max(10,Math.floor(CELL*0.3))+'px',
        color:'#facc15',fontStyle:'bold',stroke:'#000',strokeThickness:4
      }).setOrigin(0.5,0.5).setDepth(6);
    }
  }
  const homeRow=myPlayerIdx===0?7:0;
  scene.add.rectangle(OX+BOARD_PX/2,OY+homeRow*CELL+CELL/2,BOARD_PX-2,CELL-2,0x001a00,0)
    .setStrokeStyle(1,0x1a4a1a).setDepth(1);
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderAll() {
  if(!scene||!gameState) return;
  const {board,elixir,hands,queueNexts,cooldowns}=gameState;
  const myElixir=elixir[myPlayerIdx];

  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const piece=board[r][c];
      const g=cellG[r][c], t=pieceT[r][c], ct=costT[r][c];
      g.hl=false; ct.setText('');
      g.setFillStyle((r+c)%2===0?0x2d2d50:0x1e1e3a);
      if(piece){
        t.setText(PIECE_ICONS[piece.type]);
        t.setColor(piece.player===1?'#93c5fd':'#fca5a5');
        t.setFontSize((piece.type==='king'?Math.floor(CELL*0.58):Math.floor(CELL*0.48))+'px');
        if(selected&&selected.row===r&&selected.col===c){g.setFillStyle(0x1e3a5a);g.hl=true;}
      } else { t.setText(''); }

      // Cooldown overlay — show on my pieces only
      const cdKey=`${r},${c}`;
      const cdMs=cooldowns&&cooldowns[cdKey]||0;
      if(cdMs>0&&piece&&piece.player===myPlayerIdx+1){
        cdOv[r][c].setVisible(true);
        cdTxt[r][c].setText(Math.ceil(cdMs/1000)+'s');
      } else {
        cdOv[r][c].setVisible(false);
        cdTxt[r][c].setText('');
      }
    }
  }

  if(selected){
    const piece=board[selected.row][selected.col];
    if(piece){
      const onCd=cooldowns&&(cooldowns[`${selected.row},${selected.col}`]||0)>0;
      if(!onCd){
        getValidMovesClient(board,selected.row,selected.col).forEach(({row,col})=>{
          const cost=moveCostClient(piece.type,selected.row,selected.col,row,col);
          const canAfford=myElixir>=cost;
          cellG[row][col].setFillStyle(board[row][col]?0x5a1a1a:(canAfford?0x1a3a1a:0x2a2a1a));
          cellG[row][col].hl=true;
          costT[row][col].setText(cost);
          costT[row][col].setColor(canAfford?'#86efac':'#f87171');
        });
      }
    }
  }

  document.getElementById('elixir-fill').style.height=(myElixir/21*100)+'%';
  document.getElementById('elixir-val').textContent=Math.floor(myElixir);

  hands[myPlayerIdx].forEach((type,i)=>{
    document.getElementById('icon'+i).textContent=PIECE_ICONS[type];
    document.getElementById('cname'+i).textContent=PIECE_NAMES[type];
    const cost=PIECE_DEPLOY[type];
    const costEl=document.getElementById('ccost'+i);
    costEl.textContent=cost;
    const ok=myElixir>=cost;
    document.getElementById('card'+i).className='card-slot'+(selectedCard===i?' selected':'')+(ok?'':' disabled');
    costEl.className='card-cost'+(ok?'':' red');
  });

  const nt=queueNexts?.[myPlayerIdx];
  if(nt){document.getElementById('next-icon').textContent=PIECE_ICONS[nt];document.getElementById('next-name').textContent=PIECE_NAMES[nt];}
}

// ── Move validation ────────────────────────────────────────────────────────
function getValidMovesClient(board,row,col){
  const piece=board[row][col]; if(!piece) return [];
  const moves=[],p=piece.player,dir=p===1?-1:1;
  function add(r,c){if(r<0||r>=8||c<0||c>=8)return false;const t=board[r][c];if(t&&t.player===p)return false;moves.push({row:r,col:c});return!t;}
  function slide(dr,dc){for(let i=1;i<8;i++)if(!add(row+dr*i,col+dc*i))break;}
  switch(piece.type){
    case 'king':for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(row+dr,col+dc);break;
    case 'queen':slide(1,0);slide(-1,0);slide(0,1);slide(0,-1);slide(1,1);slide(1,-1);slide(-1,1);slide(-1,-1);break;
    case 'rook':slide(1,0);slide(-1,0);slide(0,1);slide(0,-1);break;
    case 'bishop':slide(1,1);slide(1,-1);slide(-1,1);slide(-1,-1);break;
    case 'knight':[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]].forEach(([dr,dc])=>add(row+dr,col+dc));break;
    case 'pawn':{const fr=row+dir;if(fr>=0&&fr<8&&!board[fr][col]){moves.push({row:fr,col});const sr=p===1?6:1;if(row===sr&&!board[row+dir*2]?.[col])moves.push({row:row+dir*2,col});}[-1,1].forEach(dc=>{if(col+dc>=0&&col+dc<8&&board[fr]?.[col+dc]?.player&&board[fr][col+dc].player!==p)moves.push({row:fr,col:col+dc});});break;}
  }
  return moves;
}

// ── Input ──────────────────────────────────────────────────────────────────
function onCellClick(row,col){
  if(!gameState||gameState.gameOver) return;
  const board=gameState.board, piece=board[row][col], myElixir=gameState.elixir[myPlayerIdx];

  if(selectedCard!==-1){socket.emit('deploy',{cardIdx:selectedCard,row,col});selectedCard=-1;renderAll();return;}

  if(piece&&piece.player===myPlayerIdx+1){
    selected=(selected&&selected.row===row&&selected.col===col)?null:{row,col};
    renderAll();return;
  }

  if(selected){
    const sp=board[selected.row][selected.col];
    if(!sp){selected=null;renderAll();return;}
    const valid=getValidMovesClient(board,selected.row,selected.col).find(m=>m.row===row&&m.col===col);
    if(!valid){selected=null;renderAll();return;}
    const cost=moveCostClient(sp.type,selected.row,selected.col,row,col);
    if(myElixir<cost){flashError();return;}
    socket.emit('move',{fromRow:selected.row,fromCol:selected.col,toRow:row,toCol:col});
    selected=null;renderAll();
  }
}

function selectCard(i){
  if(!gameState) return;
  const type=gameState.hands[myPlayerIdx][i]; if(!type) return;
  if(gameState.elixir[myPlayerIdx]<PIECE_DEPLOY[type]) return;
  selectedCard=selectedCard===i?-1:i; selected=null; renderAll();
}

function flashError(){
  const bar=document.getElementById('elixir-track');
  bar.style.outline='2px solid #dc2626';
  setTimeout(()=>bar.style.outline='none',300);
}

document.addEventListener('keydown',e=>{
  if(e.key==='1')selectCard(0);
  if(e.key==='2')selectCard(1);
  if(e.key==='3')selectCard(2);
  if(e.key==='Escape'){selected=null;selectedCard=-1;renderAll();}
});
</script>
</body>
</html>
